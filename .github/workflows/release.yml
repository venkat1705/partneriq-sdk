# Publishes @partneriq-io/{shared-types,node,browser} to npm with OIDC trusted
# publishing: no npm token exists anywhere. npm accepts a short-lived token
# minted by GitHub for this workflow file and the `npm-publish` environment, and
# attaches signed provenance to every release.
#
# How to release: see RELEASING.md. In short: bump versions on a release branch,
# merge to main, then push a tag `vX.Y.Z` that points at a commit on main.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  # Manual runs only rehearse the release (tests, pack, `npm publish --dry-run`).
  # They never publish.
  workflow_dispatch:

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify & pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release must come from main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main. Merge the release branch first."
            exit 1
          fi

      - name: Tag must match every package version
        id: version
        run: |
          set -euo pipefail
          node_v=$(node -p "require('./partneriq-node/package.json').version")
          browser_v=$(node -p "require('./partneriq-browser/package.json').version")
          types_v=$(node -p "require('./shared-types/package.json').version")
          echo "node=$node_v browser=$browser_v shared-types=$types_v"
          if [ "$node_v" != "$browser_v" ] || [ "$node_v" != "$types_v" ]; then
            echo "::error::Package versions differ. Release them together with one version."
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "v${node_v}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${node_v}."
            exit 1
          fi
          echo "version=$node_v" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: dependency install scripts never run in the release pipeline.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Test (types drift, typecheck, unit tests, build)
        run: npm run test:sdk

      - name: Pack tarballs
        run: |
          set -euo pipefail
          mkdir -p dist-packages
          for pkg in shared-types partneriq-node partneriq-browser; do
            npm pack --workspace "$pkg" --pack-destination dist-packages
          done
          ls -l dist-packages
          (cd dist-packages && sha256sum *.tgz | tee SHA256SUMS)

      - name: Rehearse publish
        run: |
          for tgz in ./dist-packages/*.tgz; do
            npm publish "$tgz" --dry-run --access public --ignore-scripts
          done

      - name: Upload tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: dist-packages/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Must match the environment configured as the npm trusted publisher. Add
    # required reviewers to it in GitHub so every release needs an approval.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@partneriq-io/node/v/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # lets npm exchange GitHub's OIDC token for a one-time publish token
    steps:
      # No checkout: this job publishes the exact tarballs that were tested above
      # and runs no repository code.
      - name: Download tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: dist-packages

      - name: Verify tarball checksums
        working-directory: dist-packages
        run: sha256sum --check SHA256SUMS

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require npm with trusted publishing support (>= 11.5.1)
        run: |
          v=$(npm --version)
          echo "npm $v"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$v" \
            || { echo "::error::npm $v is too old for OIDC trusted publishing"; exit 1; }

      # Order matters: shared-types first, then the SDKs. A version that is
      # already on npm is skipped, so a failed run can simply be re-run.
      - name: Publish
        run: |
          set -euo pipefail
          for prefix in partneriq-io-shared-types partneriq-io-node partneriq-io-browser; do
            tgz=$(ls ./dist-packages/${prefix}-[0-9]*.tgz)
            name=$(tar -xOzf "$tgz" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
            version=$(tar -xOzf "$tgz" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published; skipping."
              continue
            fi
            tag=latest
            case "$version" in *-*) tag=next ;; esac
            echo "Publishing ${name}@${version} (dist-tag ${tag})"
            npm publish "$tgz" --access public --tag "$tag" --ignore-scripts
          done
